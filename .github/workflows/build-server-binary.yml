name: Build Server binary

# 手动触发：编出带自定义改动的 MetasequoiaImeServer.exe（Release），供本地覆盖安装。
# 用法：Actions 页面点 "Run workflow"。产物在 run 的 Artifacts 里下载。

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Server Release binary
    runs-on: windows-2025
    timeout-minutes: 90
    env:
      SCCACHE_GHA_ENABLED: "true"
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
      - name: Restore dependency binaries
        id: vcpkg-cache
        uses: ./.github/actions/vcpkg-cache
        with:
          scope: server-x64-windows-and-static-md
      # The Visual Studio generator finds MSVC on its own; Ninja does not, so put cl.exe on PATH
      # before configuring. Defaults to the x64 host/target, matching the build below.
      - name: Set up MSVC environment
        uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1.13.0
      - name: Set up sccache
        uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11
      - name: Install Boost
        shell: pwsh
        run: ./scripts/ci/install-boost.ps1
      - name: Configure
        shell: pwsh
        run: >
          cmake -S server -B server/build-release -G "Ninja Multi-Config"
          -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake"
          -DVCPKG_TARGET_TRIPLET=x64-windows
          -DCMAKE_C_COMPILER_LAUNCHER=sccache
          -DCMAKE_CXX_COMPILER_LAUNCHER=sccache
      - name: Build
        shell: pwsh
        run: cmake --build server/build-release --config Release --parallel
      - name: Embed manifest
        shell: pwsh
        run: |
          $mt = Get-ChildItem "${env:ProgramFiles(x86)}/Windows Kits/10/bin" -Directory |
            Sort-Object { try { [version]$_.Name } catch { [version]'0.0' } } -Descending |
            ForEach-Object { Join-Path $_.FullName 'x64/mt.exe' } |
            Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $mt) { throw 'mt.exe not found' }
          & $mt -manifest server/MetasequoiaImeServer.manifest "-outputresource:server/build-release/bin/Release/MetasequoiaImeServer.exe;1"
          if ($LASTEXITCODE -ne 0) { throw "manifest embedding failed ($LASTEXITCODE)" }
      - name: Upload Server binary
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: MetasequoiaImeServer-custom
          path: server/build-release/bin/Release/MetasequoiaImeServer.exe
          if-no-files-found: error
